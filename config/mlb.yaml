        min_bucket_size: 150
      champion_model_path: models/mlb_outs_recorded_champion.joblib
      champion_metadata_path: models/mlb_outs_recorded_champion_metadata.json
      leaderboard_path: models/mlb_outs_recorded_leaderboard.csv
    monte_carlo_simulations: 10000
    monte_carlo_seed: 42
    fallback_std: 1.0
    allow_missing_lines: true
    park_factor_min_samples: 20
    park_factor_half_life_games: 60
  earned_runs:
