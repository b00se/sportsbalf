pipeline:
  sport: nfl
  stat: pass_attempts

nfl:
  pass_attempts:
    provider: nfl_data_py
    dataset_path: data/qb_attempts_dataset.parquet
    model_path: models/xgb_qb_attempts.joblib
    rebuild_dataset: false
    start_year: 2015
    end_year: 2024
    dataset_years:
      - 2015
      - 2016
      - 2017
      - 2018
      - 2019
      - 2020
      - 2021
      - 2022
      - 2023
    training_years:
      - 2015
      - 2016
      - 2017
      - 2018
      - 2019
      - 2020
      - 2021
      - 2022
    validation_years:
      - 2023
    inference_years:
      - 2023
    ud_algolia_id: PickemStat_de868934-c920-405c-b827-693c15aa47a1
    monte_carlo_simulations: 10000
    monte_carlo_seed: 42
    fallback_std: 1.0
