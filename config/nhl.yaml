pipeline:
  sport: nhl
  stat: shots_on_goal

nhl:
  shots_on_goal:
    inference_input_path: tests/testdata/nhl_shots_on_goal_input.csv
    model_path: models/nhl_shots_on_goal.joblib
    monte_carlo_simulations: 10000
    monte_carlo_seed: 42
