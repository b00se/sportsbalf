[tool.black]
line-length = 88
target-version = ["py311"]
include = "\.(py|pyi)$"
exclude = [
  "^\.venv/",
  "^data/",
  "^models/",
  "^notebooks/",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "pipeline", "cli", "tests"]
exclude = [
  ".venv",
  "data",
  "models",
  "notebooks",
]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
]
ignore = [
  # keep minimal; extend as needed
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

